<meta charset="utf-8">
<meta name="color-scheme" content="light"><script>document.documentElement.setAttribute('data-theme','light')</script>
<meta name="robots" content="noindex">
<title>提示詞手冊｜115年花蓮夢N自主專業研習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 固定一屏的書。桌機兩頁跨頁、窄螢幕單頁；左右翻頁（3D 翻頁），頁內不捲動，內容依頁面大小自動縮放 */
:root{
  --desk:#e3e4ea;        /* 桌面 */
  --paper:#fcfbf8;       /* 書頁 */
  --paper2:#f4f2ee;
  --board:#232a3d;       /* 黑板綠 */
  --board-ink:#eceef5;
  --ink:#1c2130;
  --ink2:#4f5668;
  --ink3:#838899;
  --line:#dcdde5;
  --accent:#b4532f;
  --accent-soft:#f6e3da;
  --chalk:#3d6fb0;
  --chalk-soft:#e2ebf7;
  --before:#6b6f80;
  --gutter-shade:rgba(28,33,48,.13);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#0e1017;--paper:#1b1e27;--paper2:#20232d;--board:#11141d;--board-ink:#dfe9e3;--ink:#e4ece7;--ink2:#a9bab2;--ink3:#7a8c84;--line:#2b3a34;
  --accent:#e8916b;--accent-soft:#3b2519;--chalk:#7fa8e0;--chalk-soft:#1d2a3d;--before:#d48f7c;--gutter-shade:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0e1017;--paper:#1b1e27;--paper2:#20232d;--board:#11141d;--board-ink:#dfe9e3;--ink:#e4ece7;--ink2:#a9bab2;--ink3:#7a8c84;--line:#2b3a34;
  --accent:#e8916b;--accent-soft:#3b2519;--chalk:#7fa8e0;--chalk-soft:#1d2a3d;--before:#d48f7c;--gutter-shade:rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);margin:0;display:flex;flex-direction:column;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px;border-radius:6px}

.top{flex:none;height:46px;display:flex;align-items:center;gap:12px;padding:0 max(16px,env(safe-area-inset-left,0px));}
.top .brand{font-family:var(--f-display);font-weight:900;font-size:17px;white-space:nowrap}
.top .brand b{color:var(--accent)}
.top .chap{flex:1;text-align:center;font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .pn{font-family:var(--f-mono);font-size:13px;color:var(--ink3);white-space:nowrap}

#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#book{position:relative;perspective:2800px;filter:drop-shadow(0 14px 28px rgba(22,37,31,.22))}
.slot,.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph)}
.slot.L{left:0}.slot.R{left:var(--pw)}
#book.single .slot.R{display:none}
.leaf{transform-style:preserve-3d;z-index:5;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face .shade{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .9s}
.leaf.go .face.front .shade{opacity:1;background:linear-gradient(90deg,rgba(0,0,0,.0),rgba(0,0,0,.18))}
.leaf.go .face.back .shade{opacity:1;background:linear-gradient(270deg,rgba(0,0,0,0),rgba(0,0,0,.14))}

/* page */
.pg{position:absolute;inset:0;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;
  --u:calc(var(--pw-n) / 680);font-size:calc(15.5px * var(--u) * var(--fs,1))}
.pg.l{border-radius:10px 2px 2px 10px}
.pg.r{border-radius:2px 10px 10px 2px}
.pg.s{border-radius:10px}
.pg.l::after,.pg.r::after{content:"";position:absolute;top:0;bottom:0;width:7%;pointer-events:none}
.pg.l::after{right:0;background:linear-gradient(270deg,var(--gutter-shade),transparent)}
.pg.r::after{left:0;background:linear-gradient(90deg,var(--gutter-shade),transparent)}
.pg.l::before,.pg.r::before{content:"";position:absolute;top:0;bottom:0;width:5px;pointer-events:none;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 2.5px);opacity:.8}
.pg.l::before{left:0}.pg.r::before{right:0}
.run{flex:none;display:flex;justify-content:space-between;align-items:center;padding:1.15em 2.2em .2em;font-size:.72em;color:var(--ink3);font-weight:700;letter-spacing:.05em}
.run .rn{font-family:var(--f-mono);color:var(--chalk)}
.pg.r .run{flex-direction:row-reverse}
.body{flex:1;min-height:0;padding:.6em 2.2em .4em;display:flex;flex-direction:column;gap:.8em;overflow:hidden}
.folio{flex:none;text-align:center;font-family:var(--f-mono);font-size:.72em;color:var(--ink3);padding:.2em 0 1em}
.pg.l .folio{text-align:left;padding-left:2.2em}.pg.r .folio{text-align:right;padding-right:2.2em}

/* opener */
.op-no{font-family:var(--f-mono);font-weight:600;color:var(--chalk);letter-spacing:.12em;font-size:.9em}
.op-name{font-family:var(--f-display);font-weight:900;font-size:2.15em;line-height:1.18;text-wrap:balance;margin:.05em 0 0}
.op-meta{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.date{font-family:var(--f-mono);font-weight:600;background:var(--chalk-soft);border-radius:999px;padding:.15em .8em;font-size:.82em;white-space:nowrap}
.state{font-size:.78em;font-weight:900;color:var(--before);border:1px solid currentColor;border-radius:999px;padding:.05em .7em}
.op-sub{color:var(--ink2);font-size:1.02em;line-height:1.6}
.rule{height:.32em;width:5.5em;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--chalk));flex:none}

/* message bubbles */
.msg{border-radius:.8em;padding:.75em .95em;font-size:.94em;line-height:1.68;position:relative}
.msg .who{font-size:.76em;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;gap:.5em;margin-bottom:.3em}
.msg.t{background:var(--chalk-soft);border:1px solid color-mix(in srgb,var(--chalk) 40%,transparent)}
.msg.a{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.msg.a .who{color:var(--accent)}
.msg .badge{font-weight:700;font-size:.92em;letter-spacing:0;padding:0 .55em;border-radius:99px;border:1px solid currentColor;opacity:.75}
.msg pre{white-space:pre-wrap;font-family:var(--f-body);margin:0}
.msg ul,.msg ol{margin:.15em 0 0;padding-left:1.2em}.msg li{margin:.1em 0}
.copy{position:absolute;top:.55em;right:.6em;font-size:.72em;font-weight:900;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:.05em .7em}
.why{border-left:.28em solid var(--chalk);padding:.15em 0 .15em .8em;color:var(--ink2);font-size:.95em;line-height:1.65}
.why b{color:var(--ink)}
.note{font-size:.8em;color:var(--ink3);border-top:1px dashed var(--line);padding-top:.5em}
.h3{font-family:var(--f-display);font-weight:900;font-size:1.3em}

/* image page */
.figp{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7em;justify-content:center}
.shot{flex:0 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.figp .shot img{max-height:calc(var(--ph) * .68)}
.hero .shot{flex:1}
.shot img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:.45em;border:1px solid var(--line);box-shadow:0 2px 10px rgba(22,37,31,.08);background:#fff}
.tag{position:absolute;left:0;top:0;font-weight:900;font-size:.8em;padding:.15em .8em;border-radius:999px;background:var(--accent);color:var(--paper);z-index:1}
.tag.before{background:var(--before)}
.cap{flex:none;font-size:.92em;line-height:1.62;color:var(--ink2)}
.cap b{color:var(--ink)}
.stack{flex:1;min-height:0;display:flex;flex-direction:column;gap:.8em}
.stack{justify-content:center}.stack .cell{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;gap:.35em}.stack .shot img{max-height:calc(var(--ph) * .3)}
.stack .cap{font-size:.86em}

/* cover */
.cov{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.9em;padding:0 2.6em}
.cov .k{font-family:var(--f-mono);font-size:.85em;letter-spacing:.14em;color:var(--accent);font-weight:600}
.cov h1{font-family:var(--f-display);font-weight:900;font-size:4.2em;line-height:1.08;margin:0;letter-spacing:.02em}
.cov h1 span{display:block;font-size:.66em;color:var(--accent)}
.cov .chalkline{height:.55em;width:9em;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--chalk))}
.cov p{font-size:1.08em;color:var(--ink2);line-height:1.75;margin:0}
.cov p b{color:var(--accent)}
.cov .who{margin-top:1.2em;border-top:1px solid var(--line);padding-top:.9em;font-weight:900;font-size:1.1em}
.cov .who em{font-style:normal;color:var(--chalk);margin:0 .35em}
.cov .who small{display:block;font-size:.75em;color:var(--ink2);font-weight:700}
.hero{background:var(--board);border-radius:1em;padding:.8em;flex:1;min-height:0;display:flex;flex-direction:column;gap:.5em}
.hero .shot img{border:0}
.hero .hc{color:var(--board-ink);font-size:.8em;display:flex;justify-content:space-between;opacity:.85}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6em;flex:none}
.fact{border:1px solid var(--line);border-radius:.8em;padding:.55em .75em;min-width:0}
.fact .k{font-size:.7em;color:var(--ink3);letter-spacing:.3em;font-weight:900}
.fact .v{font-family:var(--f-display);font-weight:900;font-size:1.3em;line-height:1.25}
.fact .s{font-size:.72em;color:var(--ink2);font-weight:700}

/* toc */
.toc{display:flex;flex-direction:column;gap:.15em;flex:1;min-height:0}
.toc button{display:grid;grid-template-columns:4.4em 1fr auto;align-items:baseline;gap:.6em;border:0;background:none;text-align:left;padding:.42em .2em;border-bottom:1px dotted var(--line);border-radius:0}
.toc button:hover{background:var(--accent-soft)}
.toc .no{font-family:var(--f-mono);font-size:.78em;color:var(--chalk);font-weight:600}
.toc .nm{font-weight:900;font-size:1.02em;line-height:1.35}
.toc .nm small{display:block;font-weight:700;font-size:.74em;color:var(--ink3)}
.toc .p{font-family:var(--f-mono);font-size:.8em;color:var(--ink2)}
.toc .sec{font-size:.74em;font-weight:900;letter-spacing:.2em;color:var(--accent);margin-top:.5em}

/* misc blocks */
.flow{display:flex;flex-direction:column;gap:.5em}
.flowlab{font-family:var(--f-mono);font-size:.75em;color:var(--ink3)}
.flowrow{display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.node{border:2px solid var(--line);background:var(--paper);border-radius:.6em;padding:.3em .7em;font-weight:900;font-size:.95em}
.node.v{border-color:var(--accent);color:var(--accent)}
.ar{color:var(--ink3);font-weight:900}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em}
.num{border:1px solid var(--line);border-radius:.8em;padding:.5em .8em}
.num b{display:block;font-family:var(--f-display);font-size:2em;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.num span{font-size:.8em;color:var(--ink2);font-weight:700}
.habit{border-bottom:1px solid var(--line);padding:.55em 0}
.habit h4{margin:0;font-size:1.08em;font-weight:900;display:flex;gap:.6em;align-items:baseline}
.habit h4 span{font-family:var(--f-mono);color:var(--chalk);font-size:.85em}
.habit p{margin:.25em 0 0;color:var(--ink2);font-size:.93em;line-height:1.6}
.habit .from{font-size:.75em;color:var(--ink3)}
.tbl{width:100%;border-collapse:collapse;font-size:.9em}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:.35em .4em;text-align:left;vertical-align:top}
.tbl th{font-size:.85em;color:var(--ink3)}
.backc{flex:1;background:var(--board);color:var(--board-ink);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1em;text-align:center;padding:2em}
.backc .t{font-family:var(--f-display);font-weight:900;font-size:2.4em}
.backc p{opacity:.85;line-height:1.8;margin:0}
.backc .chalk{color:var(--chalk);font-weight:900}

/* edge hot zones */
.hot{position:absolute;top:0;bottom:0;width:7%;z-index:8;cursor:pointer}
.hot.prev{left:-3%}.hot.next{right:-3%}
.hot::after{content:"";position:absolute;top:50%;width:1.8em;height:1.8em;margin-top:-.9em;border-radius:50%;background:var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transition:opacity .2s}
.hot.prev::after{left:15%}.hot.next::after{right:15%}
.hot:hover::after{opacity:.9}
.corner{position:absolute;right:0;bottom:0;width:0;height:0;border-style:solid;border-width:0 0 34px 34px;border-color:transparent transparent var(--paper2) transparent;filter:drop-shadow(-2px -2px 2px rgba(0,0,0,.12));z-index:7;pointer-events:none;transition:border-width .2s}
#book:hover .corner{border-width:0 0 46px 46px}

/* lightbox */
#lb{position:fixed;inset:0;z-index:60;background:rgba(10,18,15,.93);display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#lb .bar{display:flex;justify-content:space-between;align-items:center;color:#e9f0eb;gap:12px;padding-bottom:8px;font-weight:700;font-size:14px}
#lb .bar button{background:#e9f0eb;color:#16251f;border:0;border-radius:99px;padding:4px 14px;font-weight:900}
#lb .sc{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff;transition:transform .2s;cursor:zoom-in}
#lb.z img{transform:scale(var(--z,2));cursor:move}

/* dock + whiteboard */
#dock{flex:none;display:flex;justify-content:center;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:50}
.tb{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 18px rgba(22,37,31,.12);border-radius:999px;padding:5px 8px;flex-wrap:wrap;justify-content:center;max-width:100%}
.tb button{border:1px solid var(--line);background:var(--paper);border-radius:999px;min-width:36px;height:36px;padding:0 11px;font-weight:900;font-size:14px}
.tb button.ff{font-size:15px;padding:0 9px;min-width:44px;font-variant-numeric:tabular-nums}
.tb button.stop{background:var(--before);color:var(--paper);border-color:var(--before);min-width:78px}
body.ffing #dock{opacity:1!important;pointer-events:auto!important}
.tb button.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.tb .pg-n{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--ink2);min-width:64px;text-align:center}
.tb .sep{width:1px;height:22px;background:var(--line)}
.tb .sw{min-width:24px;width:24px;height:24px;padding:0;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.tb .sw.on{box-shadow:0 0 0 3px var(--ink)}
.tb input[type=range]{width:70px;accent-color:var(--accent)}
#wbtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
#wb{position:fixed;inset:0;z-index:40;touch-action:none;cursor:crosshair}
#pen{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;
  border:0;background:var(--accent);color:var(--paper);font-size:22px;box-shadow:0 4px 18px rgba(0,0,0,.2);z-index:51}
@media (max-width:640px){.top .brand{display:none}.tb .lbl{display:none}}
/* 橫式寬頁（單頁＋橫向螢幕）：圖左、說明右；文字欄限寬置中 */
.pg.wide .body{padding-left:max(2.2em,calc((100% - 52em)/2));padding-right:max(2.2em,calc((100% - 52em)/2))}
.pg.wide .body:has(> .figp),.pg.wide .body:has(> .stack){padding-left:1.6em;padding-right:1.6em}
.pg.wide .figp{flex-direction:row;align-items:center;gap:1.4em}
.pg.wide .figp .shot{flex:1 1 auto;min-width:0;height:100%}
.pg.wide .figp .shot img{max-height:calc(var(--ph) * .86)}
.pg.wide .figp .cap{flex:0 0 22%;font-size:1em}
.pg.wide .stack .shot img{max-height:calc(var(--ph) * .34)}
.pg.wide .run,.pg.wide .folio{padding-left:1.6em;padding-right:1.6em}
.pg.wide .cov{padding:0 max(2.6em,calc((100% - 40em)/2))}
/* 滿版 */
body.fill .top{display:none}
@media (max-height:520px){.top{display:none}}
body.fill #stage{padding:0}
/* 滿版時工具列透明：平常完全隱形、不擋內容；滑到螢幕底部或點底部才出現，出現時也是透明底 */
body.fill #dock,body.short #dock{position:fixed;left:0;right:0;bottom:0;opacity:0;pointer-events:none;transition:opacity .25s}
body.fill #dock.show,body.short #dock.show,body.fill #dock:has(:focus-visible),body.short #dock:has(:focus-visible){opacity:1;pointer-events:auto}
body.fill .tb,body.short .tb{background:transparent;border-color:transparent;box-shadow:none}
body.fill .tb button,body.short .tb button{background:color-mix(in srgb,var(--paper) 55%,transparent);border-color:color-mix(in srgb,var(--line) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.fill .tb button.on,body.short .tb button.on{background:color-mix(in srgb,var(--accent) 80%,transparent);color:var(--paper)}
body.fill .tb .pg-n,body.short .tb .pg-n{background:color-mix(in srgb,var(--paper) 55%,transparent);border-radius:999px;padding:6px 8px;backdrop-filter:blur(6px)}
body.fill .tb .sep,body.short .tb .sep{background:transparent}
.tb button.mode{min-width:64px}
@media (prefers-reduced-motion:reduce){.leaf{transition:none!important}}
/* ===== 研習電子書擴充 ===== */
:root{--c-indigo:#4a3fd6;--c-red:#d43c3c;--c-orange:#b4532f;--c-green:#0f7a5a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-indigo:#958dff;--c-red:#ff7d7d;--c-orange:#e8916b;--c-green:#4cc49a}}
:root[data-theme="dark"]{--c-indigo:#958dff;--c-red:#ff7d7d;--c-orange:#e8916b;--c-green:#4cc49a}
.opx{font-size:.78em;font-weight:900;color:#fff;background:#0f7a5a;border-radius:999px;padding:.12em .85em;white-space:nowrap}
.h3row{display:flex;align-items:center;justify-content:space-between;gap:.6em;flex-wrap:wrap;flex:none}
.stats{display:flex;flex-direction:column;gap:.35em}
.stat{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.45fr);align-items:center;gap:.9em;border-bottom:1px solid var(--line);padding:.4em 0}
.stat .v{font-family:var(--f-display);font-weight:900;font-size:2.45em;line-height:1.05;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .k{font-size:.72em;letter-spacing:.2em;font-weight:900;color:var(--ink3)}
.stat .l{font-weight:900;font-size:1.04em;line-height:1.4}
.stat .s{font-size:.84em;color:var(--ink2);line-height:1.5}
.legend{display:flex;gap:.5em;flex-wrap:wrap;font-size:.8em;font-weight:900}
.legend span{padding:.1em .7em;border-radius:.4em;color:#fff}
.legend span.g{color:#1c2130}
.bars{display:flex;flex-direction:column;gap:.55em}

/* 算式不換行（取自 1151030 柳營場） */
if(typeof document!=='undefined') (function(){
  const M='A-Za-z0-9()（）＋+−＝=×÷²³√.∥∠△°≤≥⊥′';
  const RUN=new RegExp(`[${M}]+(?:(?:, | |：)[${M}]+)*`,'g');
  const OP=/[＋+−＝=×÷≤≥∥⊥：²³√]/;
  const SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','SVG','svg','BUTTON','INPUT','SELECT','PRE','CODE']);
  const INL=new Set(['I','SUB','SUP','EM']);
  const ok=t=>{ t=t.trim(); return t.length>=3 && t.length<=30 && OP.test(t) && /[A-Za-z0-9]/.test(t); };
  function group(el){
    const kids=[...el.childNodes]; let g=[];
    const flush=()=>{ if(g.length) wrapGroup(g); g=[]; };
    kids.forEach(n=>{
      if(n.nodeType===3 || (n.nodeType===1 && INL.has(n.tagName) && !n.querySelector('*'))) g.push(n);
      else { flush(); if(n.nodeType===1 && !SKIP.has(n.tagName) && !(n.classList&&n.classList.contains('eq'))) group(n); }
    });
    flush();
  }
  function wrapGroup(nodes){
    let text='', map=[];
    nodes.forEach(n=>{ const t=n.textContent; map.push([n,text.length,text.length+t.length]); text+=t; });
    if(!OP.test(text)) return;
    const runs=[]; let m; RUN.lastIndex=0;
    while((m=RUN.exec(text))){ let s=m.index, e=s+m[0].length; while(text[s]===' ') s++; while(e>s && text[e-1]===' ') e--;
      const lab=/^(?:\d+|[A-Z])：(?=[A-Za-z(（−√∠])/.exec(text.slice(s,e)); if(lab) s+=lab[0].length;
      const bal=()=>{ const t=text.slice(s,e); return [(t.match(/[（(]/g)||[]).length,(t.match(/[）)]/g)||[]).length]; };
      for(let g=0;g<3;g++){ const [o,c]=bal(); if(o>c && /[（(]/.test(text[e-1])) e--; else if(c>o && /[）)]/.test(text[e-1])) e--; else if(c>o && /[）)]/.test(text[s])) s++; else if(o>c && /[（(]/.test(text[s])) s++; else break; }
      if(ok(text.slice(s,e))) runs.push([s,e]); }
    for(let k=runs.length-1;k>=0;k--){
      const [s,e]=runs[k], r=document.createRange();
      const at=(pos,isEnd)=>{ for(const [n,a,b] of map){ if(isEnd? (pos>a&&pos<=b) : (pos>=a&&pos<b)){ return [n,pos-a]; } } return null; };
      const A=at(s,false), B=at(e,true); if(!A||!B) continue;
      try{
        if(A[0].nodeType===3) r.setStart(A[0],A[1]); else r.setStartBefore(A[0]);
        if(B[0].nodeType===3) r.setEnd(B[0],B[1]); else r.setEndAfter(B[0]);
        const sp=document.createElement('span'); sp.className='eq'; r.surroundContents(sp);
      }catch(err){}
    }
  }
  window.__eqWrap=el=>{ try{ group(el); }catch(e){} };
  document.head.insertAdjacentHTML('beforeend','<style>.eq{white-space:nowrap}</style>');
})();

function makePage(i,side){

/* 投影／滿版（寬頁）改成簡報版型：視覺內容放左欄，標題與說明放右欄 */
const SL_HEAD='.op-no,.op-name,.op-meta,.op-sub,.rule,.h3row,.echo';
const SL_VIS='.tbl,.stats,.bars,.legend,.cols,.qbox,.big-quote,.cards,.msg,.flow,.hidcard,.hidl,.memo,.svgwrap,.nums';
function slideify(el){
  if(!el.classList.contains('wide')) return;
  const b=el.querySelector('.body'); if(!b||b.dataset.sl) return; b.dataset.sl=1;
  const kids=[...b.children], head=[], vis=[], txt=[], foot=[];
  kids.forEach(k=>{ if(k.matches(SL_HEAD)) head.push(k); else if(k.matches(SL_VIS)) vis.push(k); else if(k.matches('.note')) foot.push(k); else txt.push(k); });
  const isOpen=!!b.querySelector('.op-name');
  const mk=(c,arr)=>{ const d=document.createElement('div'); d.className=c; arr.forEach(x=>d.appendChild(x)); return d; };
  const len=arr=>arr.reduce((n,x)=>n+(x.textContent||'').replace(/\s+/g,'').length,0);
  b.innerHTML=''; b.classList.add('sl');
  const right = isOpen ? [...head,...txt] : txt;
  if(vis.length && right.length){
    const L=len(vis), R=len(right)+(isOpen?40:0);
    const heavy=vis.some(x=>x.matches('.stats,.tbl,.qbox,.bars,.cols,.msg'));
    const fr=Math.max(heavy?1.3:0.85, Math.min(2.2, (L/(R||1))*0.9));
    if(!isOpen) b.appendChild(mk('sl-head',head));
    const m=mk('sl-main sl-two',[mk('sl-l',vis),mk('sl-r',right)]);
    m.style.gridTemplateColumns=`minmax(0,${fr.toFixed(2)}fr) minmax(0,1fr)`;
    b.appendChild(m);
  } else {
    b.appendChild(mk('sl-head',head)); b.appendChild(mk('sl-main sl-one',[...vis,...txt]));
  }
  if(foot.length) b.appendChild(mk('sl-foot',foot));
}
/* 自動放大到填滿整頁：找出不超出頁面的最大字級（滿版／投影時上限更高） */
function fitPage(el){
  slideify(el);
  const b=el.querySelector('.body'); if(!b) return;
  const wide=el.classList.contains('wide')||el.classList.contains('s');
  const boxes=()=>[b,...b.querySelectorAll('.sl-main,.sl-l,.sl-r,.sl-one')];
  const over=()=>boxes().some(x=>x.scrollHeight>x.clientHeight+1||x.scrollWidth>x.clientWidth+1);
  let lo=0.45, hi=el.classList.contains('wide')?2.2:(wide?2.4:1.7);
  el.style.setProperty('--fs',1);
  if(over()) hi=1;
  for(let k=0;k<9;k++){ const mid=(lo+hi)/2; el.style.setProperty('--fs',mid); if(over()) hi=mid; else lo=mid; }
  el.style.setProperty('--fs',lo);
}
function fill(slot,i,side){ slot.innerHTML=''; const pg=makePage(i,side); slot.appendChild(pg); fitPage(pg); }
let viewMode='auto', fillMode=false;
try{ viewMode=localStorage.getItem('ebkView_1151108_宜昌國中_prompt')||'auto'; }catch(e){}
function layout(){
  const r=stage.getBoundingClientRect();
  const pad = fillMode ? 0 : 24;
  const availW=r.width-pad, availH=r.height-(fillMode?0:16);
  const narrow = availW < 820 || availW/availH < 1.15 || availH < 520;
  single = viewMode==='single' || (viewMode==='auto' && narrow);
  let ph=availH, pw;
  if(single){
    if(fillMode || availW/availH >= 1.15){ pw=availW; if(!fillMode) pw=Math.min(availW, ph*1.9); }   // 橫式寬頁
    else { pw=Math.min(availW, ph*0.82); ph=Math.min(ph, pw/0.62); }
  } else {
    pw = fillMode ? availW/2 : Math.min(availW/2, ph*0.92);
  }
  if(window.__AUDASP && single){ const A=window.__AUDASP; if(pw/ph > A) pw=ph*A; else ph=pw/A; }   /* v1.6：連上投影視窗時用投影機的長寬比，兩邊版面一致 */
  pw=Math.floor(pw); ph=Math.floor(ph);
  book.style.setProperty('--pw',pw+'px'); book.style.setProperty('--ph',ph+'px');
  book.style.setProperty('--pw-n',Math.min(pw, ph*0.92));
  book.classList.toggle('wide', single && pw/ph > 1.25);
  $('#bMode').textContent = single ? '單頁' : '雙頁';
  $('#bMode').title = (single?'目前單頁，按一下改雙頁':'目前雙頁，按一下改單頁')+'（D）';
  $('#bFill').classList.toggle('on', fillMode);
  book.style.width=(single?pw:pw*2)+'px'; book.style.height=ph+'px';
  book.classList.toggle('single',single);
  if(!single && cur%2) cur--;
  render();
}
function render(){
  book.innerHTML='<div class="slot L"></div><div class="slot R"></div><div class="hot prev" data-nav="-1"></div><div class="hot next" data-nav="1"></div><div class="corner"></div>';
  // --pw-n 需在 .pg 上可用
  if(single){ fill(book.querySelector('.slot.L'),cur,'s'); }
  else { fill(book.querySelector('.slot.L'),cur,'l'); fill(book.querySelector('.slot.R'),cur+1,'r'); }
  status();
}
function status(){
  const total=PAGES.length;

  $('#pgn').textContent = single ? `${cur+1} / ${total}` : `${cur+1}–${Math.min(cur+2,total)} / ${total}`;
  const u = (PAGES[single?cur:cur+1]||{}).u ?? p.u;
  $('#chap').textContent = u!=null ? UNITS[u][0]+'　'+UNITS[u][1] : (cur<2?'封面':'目錄');
  $('#pn').textContent = '';

const RM = matchMedia('(prefers-reduced-motion: reduce)');
function turnTo(target){
  if(busy) return;
  const total=PAGES.length;
  if(!single) target = target - (target%2);
  target=Math.max(0,Math.min(target, single?total-1:total-(total%2?1:2)));
  if(target===cur) return;
  const fwd = target>cur;
  if(RM.matches){ cur=target; render(); return; }
  busy=true;
  const L=book.querySelector('.slot.L'), R=book.querySelector('.slot.R');
  const leaf=document.createElement('div'); leaf.className='leaf';
  const front=document.createElement('div'); front.className='face front';
  const back=document.createElement('div'); back.className='face back';
  leaf.append(front,back);
  const addShade=f=>{const s=document.createElement('div');s.className='shade';f.appendChild(s)};
  if(single){
    if(fwd){
      front.appendChild(makePage(cur,'s')); back.appendChild(makePage(-1,'s'));
      fill(L,target,'s');
      leaf.style.left='0'; leaf.style.transformOrigin='0 50%'; leaf.style.transform='rotateY(0deg)';
      book.appendChild(leaf); addShade(front); addShade(back); fitPage(front.firstChild);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{leaf.classList.add('go');leaf.style.transition=`transform ${FLIP.dur}s cubic-bezier(.35,.05,.25,1)`;leaf.style.transform='rotateY(-178deg)';}));
    }else{
      front.appendChild(makePage(target,'s')); back.appendChild(makePage(-1,'s'));
      leaf.style.left='0'; leaf.style.transformOrigin='0 50%'; leaf.style.transform='rotateY(-178deg)';
      book.appendChild(leaf); addShade(front); addShade(back); fitPage(front.firstChild);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{leaf.classList.add('go');leaf.style.transition=`transform ${FLIP.dur}s cubic-bezier(.35,.05,.25,1)`;leaf.style.transform='rotateY(0deg)';}));
    }
  }else{
    if(fwd){
      front.appendChild(makePage(cur+1,'r')); back.appendChild(makePage(target,'l'));
      fill(R,target+1,'r');
      leaf.style.left='var(--pw)'; leaf.style.transformOrigin='0 50%'; leaf.style.transform='rotateY(0deg)';
      book.appendChild(leaf); addShade(front); addShade(back); fitPage(front.firstChild); fitPage(back.firstChild);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{leaf.classList.add('go');leaf.style.transition=`transform ${FLIP.dur}s cubic-bezier(.35,.05,.25,1)`;leaf.style.transform='rotateY(-180deg)';}));
    }else{
      front.appendChild(makePage(cur,'l')); back.appendChild(makePage(target+1,'r'));
      fill(L,target,'l');
      leaf.style.left='0'; leaf.style.transformOrigin='100% 50%'; leaf.style.transform='rotateY(0deg)';
      book.appendChild(leaf); addShade(front); addShade(back); fitPage(front.firstChild); fitPage(back.firstChild);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{leaf.classList.add('go');leaf.style.transition=`transform ${FLIP.dur}s cubic-bezier(.35,.05,.25,1)`;leaf.style.transform='rotateY(180deg)';}));
    }
  }
  let done=false;
  const finish=()=>{ if(done) return; done=true; cur=target; render(); busy=false; };
  leaf.addEventListener('transitionend',finish,{once:true});
  setTimeout(finish,FLIP.dur*1000+300);
}
const step=d=>turnTo(cur + d*(single?1:2));
/* 快轉／倒轉：連續自動翻頁。第一下 2 倍速、第二下 4 倍速、第三下停；按翻頁鍵、目錄、Esc 或翻到底也會停 */
const FLIP={dur:.8};
const FF={dir:0,lv:0,t:null};
const FF_SPEED=[.8,.34,.17];   // 一般、2×、4× 的單頁翻頁秒數
function ffStop(){ FF.dir=0; FF.lv=0; clearTimeout(FF.t); FLIP.dur=FF_SPEED[0]; ffUI(); }
function ffUI(){
  const r=$('#bRew'), f=$('#bFf'); if(!r) return;
  r.classList.toggle('on',FF.dir<0); f.classList.toggle('on',FF.dir>0);
  $('#bStop').hidden = !FF.dir; document.body.classList.toggle('ffing', !!FF.dir);
  r.textContent = FF.dir<0 ? '⏪ '+(FF.lv===1?'2×':'4×') : '⏪';
  f.textContent = FF.dir>0 ? '⏩ '+(FF.lv===1?'2×':'4×') : '⏩';
}
function ffTick(){
  if(!FF.dir) return;
  const total=PAGES.length, atEnd = FF.dir>0 ? cur >= total-(single?1:2) : cur<=0;
  if(atEnd){ ffStop(); return; }
  if(!busy) step(FF.dir);
  FF.t=setTimeout(ffTick, FLIP.dur*1000+80);
}
function ffPress(d){
  if(FF.dir===d){ FF.lv++; if(FF.lv>2){ ffStop(); return; } }
  else { FF.dir=d; FF.lv=1; }
  FLIP.dur=FF_SPEED[FF.lv]; ffUI(); clearTimeout(FF.t); ffTick();
}

book.addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)>30||Math.abs(e.deltaX)>30){ e.preventDefault(); if(!busy) step((e.deltaY||e.deltaX)>0?1:-1);} },{passive:false});
// lightbox
function openLB(k,c){ $('#lbimg').src=IMG[k]; $('#lbcap').textContent=c||''; $('#lb').classList.remove('z'); $('#lbz').textContent='放大'; $('#lb').hidden=false; }
function closeLB(){ $('#lb').hidden=true; }
$('#lbx').onclick=closeLB;
$('#lbz').onclick=()=>{ const z=$('#lb').classList.toggle('z'); $('#lbz').textContent=z?'縮回':'放大'; if(!z) $('#lbimg').style.transformOrigin=''; };
$('#lbimg').addEventListener('click',e=>{ const lb=$('#lb'); const r=e.target.getBoundingClientRect();
  e.target.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`;
  const z=lb.classList.toggle('z'); $('#lbz').textContent=z?'縮回':'放大'; });
$('#lbimg').addEventListener('mousemove',e=>{ if(!$('#lb').classList.contains('z')) return; const r=e.target.getBoundingClientRect();
  e.target.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`; });
$('#lbsc').addEventListener('click',e=>{ if(e.target.id==='lbsc') closeLB(); });
// dock
$('#fold').onclick=()=>{ $('#dock').hidden=true; $('#pen').hidden=false; layout(); };
$('#pen').onclick=()=>{ $('#dock').hidden=false; $('#pen').hidden=true; layout(); };
/* 白板：每個跨頁一層 */
const cv=$('#wb'), ctx=cv.getContext('2d'); const LAY={}; let tool='pen', color='#d63a2f', wbOn=false, wbView=false, drawing=null;
const bookR=()=>book.getBoundingClientRect();   /* v1.6：筆跡存成「書頁比例座標」，投影視窗大小不同也能對準 */
function fitCv(){ const r=devicePixelRatio||1; cv.width=innerWidth*r; cv.height=innerHeight*r; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; ctx.setTransform(r,0,0,r,0,0); redraw(); }
const key=()=>single?cur:cur-(cur%2);
function strokes(){ return LAY[key()]||(LAY[key()]=[]); }
function redraw(){ ctx.clearRect(0,0,cv.width,cv.height); for(const s of strokes()) paint(s); }
function paint(s){ if(!s.p.length) return; const r=bookR(), X=q=>r.left+q[0]*r.width, Y=q=>r.top+q[1]*r.height, w=s.w*r.width;
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  if(s.t==='er'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=w*4}
  else{ctx.globalAlpha=s.t==='hl'?.35:1; ctx.lineWidth=s.t==='hl'?w*4:w; ctx.strokeStyle=s.c}
  ctx.beginPath(); ctx.moveTo(X(s.p[0]),Y(s.p[0])); for(const q of s.p) ctx.lineTo(X(q),Y(q)); ctx.stroke(); ctx.restore(); }
/* v1.6：白板同步到投影視窗（講師版的 teacher.js 提供 __wbCast；投影視窗用 __wbRecv 接收） */
let wbRaf=0;
function wbCast(){ if(window.__wbCast) window.__wbCast(key(), strokes(), wbOn); }
function wbCastSoon(){ if(wbRaf) return; wbRaf=requestAnimationFrame(()=>{ wbRaf=0; wbCast(); }); }
window.__wbSync=wbCast;
window.__wbRecv=m=>{ LAY[m.k]=m.s; wbView=!!m.on; cv.hidden=!wbView; cv.style.pointerEvents='none'; if(wbView) fitCv(); };
function wbLoad(){ if(wbOn||wbView) redraw(); if(wbOn) wbCast(); }
function setWB(on){ wbOn=on; cv.hidden=!on; $('#wbtools').hidden=!on; $('#wbOn').hidden=on; if(on) fitCv(); wbCast(); }
$('#wbOn').onclick=()=>setWB(true); $('#wbOff').onclick=()=>setWB(false);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b))});
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===b)); if(tool==='er'){tool='pen';document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x.dataset.tool==='pen'))}});
$('#wbUndo').onclick=()=>{strokes().pop();redraw();wbCast()}; $('#wbClr').onclick=()=>{LAY[key()]=[];redraw();wbCast()};
const toN=e=>{ const r=bookR(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; };
cv.addEventListener('pointerdown',e=>{ drawing={t:tool,c:color,w:(+$('#wbw').value)/bookR().width,p:[toN(e)]}; strokes().push(drawing); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!drawing) return; drawing.p.push(toN(e)); redraw(); wbCastSoon(); });
cv.addEventListener('pointerup',()=>{ drawing=null; wbCast(); }); cv.addEventListener('pointercancel',()=>{ drawing=null; wbCast(); });

/* 啟動 */
const m=(location.hash||'').match(/^#p(\d+)$/); if(m) cur=Math.max(0,Math.min(PAGES.length-1,+m[1]-1));
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ layout(); if(wbOn) fitCv(); },120); });
layout();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>render());
</script>
